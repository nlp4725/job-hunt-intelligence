# Cloud CI/CD (terraform/README.md). Tests on every push and pull request;
# deploys to AWS on pushes to main once the repository variables AWS_ACCOUNT_ID
# and DOMAIN are set. AWS access is keyless: GitHub's OIDC token assumes jhi-github-deploy,
# which only trusts the "production" environment of this repository.
name: cloud

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.15.1"
  AWS_REGION: us-east-1

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: jhi
          POSTGRES_DB: jhi_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jhi" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      JHI_TEST_POSTGRES_URL: postgresql+psycopg://jhi@localhost:5432/jhi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Install
        run: pip install -r requirements-cloud.txt -r terraform/requirements-test.txt "moto[s3]==5.2.3" fpdf2==2.8.7   # fpdf2 writes test PDFs
      - name: Cloud API tests
        run: python -m pytest -q tests_and_eval/test_cloud_*.py tests_and_eval/test_extension_cloud_sync.py
      - name: Terraform tests (rules, fmt, validate)
        run: python -m pytest -q terraform/tests

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ACCOUNT_ID != '' && vars.DOMAIN != ''
    runs-on: ubuntu-24.04-arm          # the image is linux/arm64; build it natively
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/jhi-github-deploy
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push the image (skipped if this commit is already pushed)
        run: |
          image="${{ steps.ecr.outputs.registry }}/jhi-cloud:$IMAGE_TAG"
          if aws ecr describe-images --repository-name jhi-cloud --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "$image already exists"
          else
            docker build --platform linux/arm64 -t "$image" .
            docker push "$image"
          fi
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Terraform apply
        working-directory: terraform/app
        env:
          TF_VAR_image_tag: ${{ github.sha }}
          TF_VAR_domain: ${{ vars.DOMAIN }}
          TF_VAR_hosted_zone_id: ${{ vars.HOSTED_ZONE_ID }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}   # environment secrets: kept out of public logs
          TF_VAR_owner_email: ${{ secrets.OWNER_EMAIL }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=jhi-tfstate-${{ vars.AWS_ACCOUNT_ID }}" \
            -backend-config="key=app/terraform.tfstate" -backend-config="region=$AWS_REGION"
          terraform apply -input=false -auto-approve
          terraform output -json > ../../outputs.json
      - name: Upload the web app (once it exists)
        if: hashFiles('webapp/package.json') != ''
        run: |
          cd webapp && npm ci && npm run build && cd ..
          aws s3 sync webapp/dist "s3://$(jq -r '.frontend_bucket.value' outputs.json)" --delete
          aws cloudfront create-invalidation --distribution-id "$(jq -r '.distribution_id.value' outputs.json)" --paths "/*"
