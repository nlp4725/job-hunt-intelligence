# Alembic migrations for the CLOUD Postgres database only.
# The local SQLite file keeps its own migrations in db/session.py:init_db().
#
#   JHI_DATABASE_URL=postgresql+psycopg://user@host:5432/db ./venv/bin/alembic upgrade head
#
# The database URL is read from JHI_DATABASE_URL in db/migrations/env.py, never
# written here.

[alembic]
script_location = %(here)s/db/migrations
prepend_sys_path = %(here)s
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
