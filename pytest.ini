[pytest]
testpaths = tests_and_eval
python_files = test_*.py

# These modules are hand-run API probes, not pytest suites: importing them
# fires live network calls and requires optional SDKs (tavily) that are not in
# requirements.txt. They predate the pytest setup and are skipped at collection
# so `pytest` runs clean; run them directly with python when needed.
addopts =
    --ignore=tests_and_eval/test_tavily_raw.py
    --ignore=tests_and_eval/test_company_report_tavily.py
    --ignore=tests_and_eval/test_perplexity_raw.py
    --ignore=tests_and_eval/test_langchain_raw.py
    --ignore=tests_and_eval/test_company_report.py
    # LangSmith evaluation harnesses: these are the calibration runs for
    # Seniority Fit / Expertise Match (20-job datasets x 3 reps against live
    # DeepSeek + Claude). They cost money per run and are not unit tests — run
    # them deliberately when re-calibrating a rubric, never as part of `pytest`.
    --ignore=tests_and_eval/test_seniority
    --ignore=tests_and_eval/test_expertise
    --ignore=tests_and_eval/test_seniority_n_expertise
